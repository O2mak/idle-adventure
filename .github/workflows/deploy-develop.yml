name: 베타 서버 배포 (develop)

# develop 브랜치에 push하면 베타(테스트) 서버에 자동으로 올라갑니다.
# 주소: https://develop-idlegame.idlegame-server.workers.dev  (Worker 이름: develop-idlegame, DB: idlegame-dev)
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-develop
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: 공유 코드 동기화 (화면과 서버가 같은 규칙을 쓰도록 복사)
        run: npm run sync
      - name: DB 표 적용 (이미 있으면 그대로 둠)
        run: npx wrangler d1 execute idlegame-dev --remote --file=schema.sql --yes
      - name: 배포
        run: npx wrangler deploy --env develop