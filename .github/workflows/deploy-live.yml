name: 라이브 서버 배포 (cloudflare)

# cloudflare 브랜치에 push하면 라이브(진짜 유저가 쓰는) 서버에 자동으로 올라갑니다. 서버 테스트가 통과해야만 올라갑니다.
# 주소: https://idlegame.idlegame-server.workers.dev  (Worker 이름: idlegame, DB: idlegame)
on:
  push:
    branches: [cloudflare]
  workflow_dispatch:

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: 공유 코드 동기화
        run: npm run sync
      - name: 서버 테스트 (임시 로컬 서버를 띄워서 실행)
        run: |
          echo "ADMIN_KEY=dev-admin-key" > .dev.vars
          npm run db:init
          npx wrangler dev --port 8787 > dev.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -s http://127.0.0.1:8787/api/season > /dev/null; then break; fi
            sleep 2
          done
          node test/api.test.mjs || { echo "--- 로컬 서버 로그 ---"; tail -n 60 dev.log; exit 1; }
      - name: DB 표 적용 (이미 있으면 그대로 둠)
        run: npx wrangler d1 execute idlegame --remote --file=schema.sql --yes
      # 테스트 시즌 설정 — 정식 운영 때 이 값을 정리해야 함
      # 2026-10-20: 시즌 3(10/20 06:00 시작)을 번호 그대로 11/15 06:00까지 유지. 624시간 = 26일, 번호 +2
      #   (이전 설정: 10/16 06:00부터 48시간마다 → 시즌 1·2가 지나고 3이 진행 중이었음)
      - name: 배포 (테스트 시즌 설정 포함)
        run: npx wrangler deploy --var FIRST_SEASON_START:2026-10-20T06:00:00+09:00 --var TEST_SEASON_HOURS:624 --var TEST_SEASON_OFFSET:2